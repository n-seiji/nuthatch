name: Release

on:
  push:
    tags:
      - "v*"
    # A version bump merged to main releases itself: `prepare` finds no tag
    # for the new package.json version, and `publish` creates it last. Every
    # other main push stops at `prepare`, since its version is already tagged.
    branches: [main]
    # Path filters never apply to tag pushes, so this only narrows main pushes
    # to the ones that can carry a version bump.
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Sole owner of the release identity: the version comes from package.json,
  # and a pushed tag must match it.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - id: version
        name: Decide the release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          tag="v$version"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vX.Y.Z: $tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=true
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "$tag" ]; then
              echo "::error::Tag $REF_NAME does not match package.json version $version"
              exit 1
            fi
          elif [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "$tag already exists; nothing to release."
            release=false
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: bun test
      - run: bun run build

      - name: npm pack
        run: |
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: /tmp/pack/*.tgz
          retention-days: 1

  smoke-test-tarball:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24", "26"]
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: /tmp/pack

      - name: Install tarball and smoke-test the bin
        run: |
          set -euo pipefail
          npm install -g /tmp/pack/*.tgz
          hop --help || true
          git init --initial-branch=main /tmp/smoke-repo
          cd /tmp/smoke-repo
          git -c user.email=ci@example.com -c user.name=ci commit --allow-empty -m init
          hop ls --json
          hop root --json

  build-binaries:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - target: darwin-arm64
            bun-target: bun-darwin-arm64
          - target: darwin-x64
            bun-target: bun-darwin-x64
          - target: linux-x64
            bun-target: bun-linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - run: bun install --frozen-lockfile

      - name: Compile binary
        run: |
          set -euo pipefail
          mkdir -p out
          # --bytecode precompiles the bundle so a run skips parsing it; it
          # needs a Bun that supports ESM bytecode (1.2.21 refused it).
          bun build ./src/cli.ts --compile --bytecode --format esm \
            --target=${{ matrix.bun-target }} \
            --outfile out/hop-${{ matrix.target }}
          chmod +x out/hop-${{ matrix.target }}

      - name: Generate SHA-256 checksum
        run: |
          set -euo pipefail
          sha256sum "out/hop-${{ matrix.target }}" > "out/hop-${{ matrix.target }}.sha256"

      - name: Smoke test (native arch only)
        if: matrix.target == 'linux-x64'
        run: |
          set -euo pipefail
          bin="$(pwd)/out/hop-${{ matrix.target }}"
          "$bin" --help || true
          git init --initial-branch=main /tmp/smoke-repo
          cd /tmp/smoke-repo
          git -c user.email=ci@example.com -c user.name=ci commit --allow-empty -m init
          "$bin" ls --json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/hop-${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: out/hop-${{ matrix.target }}*
          retention-days: 1

  smoke-test-darwin-arm64:
    needs: build-binaries
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-darwin-arm64
          path: /tmp/binary

      - name: Smoke-test darwin-arm64 binary
        run: |
          set -euo pipefail
          bin="/tmp/binary/hop-darwin-arm64"
          chmod +x "$bin"
          "$bin" --help || true
          smoke_repo="$(mktemp -d)"
          trap 'rm -rf "$smoke_repo"' EXIT
          git init --initial-branch=main "$smoke_repo"
          cd "$smoke_repo"
          git -c user.email=ci@example.com -c user.name=ci commit --allow-empty -m init
          "$bin" ls --json
          "$bin" root --json

  publish:
    # Publish only after every build/test/smoke-test job above is green, and
    # Always last, so a broken build or failed smoke test never reaches npm
    # Or GitHub Releases.
    needs: [prepare, build, smoke-test-tarball, build-binaries, smoke-test-darwin-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: /tmp/pack

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: /tmp/binaries
          merge-multiple: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted Publishing (OIDC) requires Node >= 22.14 / npm >= 11.5.1. Use current LTS.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm for trusted publishing
        run: npm install -g npm@12.2.0 && npm --version

      - name: Publish to npm (Trusted Publishing, no token)
        env:
          PACKAGE_NAME: "@n-seiji/nuthatch"
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if published_version="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null)"; then
            if [ "$published_version" = "$PACKAGE_VERSION" ]; then
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists; skipping npm publish."
              exit 0
            fi
          fi
          # Staged-only trusted publisher: stage here, then a human promotes on npmjs.com.
          npm stage publish /tmp/pack/*.tgz --access public --provenance

      # On a main push the tag does not exist yet; the Release creates it on
      # this commit, so a failed build never leaves a dangling tag behind.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: /tmp/binaries/hop-*
          generate_release_notes: true
