name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - id: version
        name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vX.Y.Z: $RELEASE_TAG"
            exit 1
          fi
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          tag_version="${RELEASE_TAG#v}"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $package_version"
            exit 1
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun test
      - run: bun run build

      - name: npm pack
        run: |
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: /tmp/pack/*.tgz
          retention-days: 1

  smoke-test-tarball:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: /tmp/pack

      - name: Install tarball and smoke-test the bin
        run: |
          set -euo pipefail
          npm install -g /tmp/pack/*.tgz
          hop --help || true
          git init --initial-branch=main /tmp/smoke-repo
          cd /tmp/smoke-repo
          git -c user.email=ci@example.com -c user.name=ci commit --allow-empty -m init
          hop ls --json
          hop root --json

  build-binaries:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: darwin-arm64
            bun-target: bun-darwin-arm64
          - target: darwin-x64
            bun-target: bun-darwin-x64
          - target: linux-x64
            bun-target: bun-linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - run: bun install --frozen-lockfile

      - name: Compile binary
        run: |
          set -euo pipefail
          mkdir -p out
          bun build ./src/cli.ts --compile --target=${{ matrix.bun-target }} \
            --outfile out/hop-${{ matrix.target }}
          chmod +x out/hop-${{ matrix.target }}

      - name: Generate SHA-256 checksum
        run: |
          set -euo pipefail
          sha256sum "out/hop-${{ matrix.target }}" > "out/hop-${{ matrix.target }}.sha256"

      - name: Smoke test (native arch only)
        if: matrix.target == 'linux-x64'
        run: |
          set -euo pipefail
          bin="$(pwd)/out/hop-${{ matrix.target }}"
          "$bin" --help || true
          git init --initial-branch=main /tmp/smoke-repo
          cd /tmp/smoke-repo
          git -c user.email=ci@example.com -c user.name=ci commit --allow-empty -m init
          "$bin" ls --json

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: out/hop-${{ matrix.target }}*
          retention-days: 1

  smoke-test-darwin-arm64:
    needs: build-binaries
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binary-darwin-arm64
          path: /tmp/binary

      - name: Smoke-test darwin-arm64 binary
        run: |
          set -euo pipefail
          bin="/tmp/binary/hop-darwin-arm64"
          chmod +x "$bin"
          "$bin" --help || true
          smoke_repo="$(mktemp -d)"
          trap 'rm -rf "$smoke_repo"' EXIT
          git init --initial-branch=main "$smoke_repo"
          cd "$smoke_repo"
          git -c user.email=ci@example.com -c user.name=ci commit --allow-empty -m init
          "$bin" ls --json
          "$bin" root --json

  publish:
    # Publish only after every build/test/smoke-test job above is green, and
    # Always last, so a broken build or failed smoke test never reaches npm
    # Or GitHub Releases.
    needs: [build, smoke-test-tarball, build-binaries, smoke-test-darwin-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: /tmp/pack

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: /tmp/binaries
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing (OIDC) requires Node >= 22.14 / npm >= 11.5.1. Use current LTS.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Publish to npm (Trusted Publishing, no token)
        env:
          PACKAGE_NAME: "@n-seiji/nuthatch"
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if published_version="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null)"; then
            if [ "$published_version" = "$PACKAGE_VERSION" ]; then
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists; skipping npm publish."
              exit 0
            fi
          fi
          # Staged-only trusted publisher: stage here, then a human promotes on npmjs.com.
          npm stage publish /tmp/pack/*.tgz --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/binaries/hop-*
          generate_release_notes: true
