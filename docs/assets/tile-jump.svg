    <text x="64" y="215" fill="#f5f5f7">● codex/fix-x</text><text x="300" y="215" fill="#f5f5f7" fill-opacity="0.55">ext</text>
  </g>
  <g class="f f1">
    <rect x="52" y="146" width="376" height="36" rx="9" fill="#f5f5f7"/>
    <text x="64" y="127" fill="#f5f5f7">● main</text><text x="300" y="127" fill="#f5f5f7" fill-opacity="0.55">root</text>
    <text x="64" y="171" fill="#121214">○ feat/picker</text><text x="300" y="171" fill="#121214" fill-opacity="0.6">managed</text>
    <text x="64" y="215" fill="#f5f5f7">● codex/fix-x</text><text x="300" y="215" fill="#f5f5f7" fill-opacity="0.55">ext</text>
  </g>
  <g class="f f2">
    <rect x="52" y="190" width="376" height="36" rx="9" fill="#f5f5f7"/>
    <text x="64" y="127" fill="#f5f5f7">● main</text><text x="300" y="127" fill="#f5f5f7" fill-opacity="0.55">root</text>
    <text x="64" y="171" fill="#f5f5f7">○ feat/picker</text><text x="300" y="171" fill="#f5f5f7" fill-opacity="0.55">managed</text>
    <text x="64" y="215" fill="#121214">● codex/fix-x</text><text x="300" y="215" fill="#121214" fill-opacity="0.6">ext</text>
  </g>
    <text x="62" y="262" fill="#f5f5f7" fill-opacity="0.45" font-size="15" letter-spacing="2">BRANCHES</text>
