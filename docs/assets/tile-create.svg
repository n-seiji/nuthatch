  <rect x="36" y="64" width="408" height="232" rx="18" fill="#151517" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <path d="M37 98 H443" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="64" cy="81" r="5" fill="#3a3a40"/><circle cx="84" cy="81" r="5" fill="#3a3a40"/><circle cx="104" cy="81" r="5" fill="#3a3a40"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">
