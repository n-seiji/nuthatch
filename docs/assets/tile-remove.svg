<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 480 360" fill="none" role="img" aria-label="Remove worktrees">
  <style>
    .c { animation-duration: 5s; animation-iteration-count: infinite; }
    .c0 { animation-name: g0; } .c1 { animation-name: g1; } .c2 { animation-name: g2; }
    @keyframes g0 { 0%, 30% { opacity: 1 } 38%, 92% { opacity: 0 } 100% { opacity: 1 } }
    @keyframes g1 { 0%, 45% { opacity: 1 } 53%, 92% { opacity: 0 } 100% { opacity: 1 } }
    @keyframes g2 { 0%, 60% { opacity: 1 } 68%, 92% { opacity: 0 } 100% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .c { animation: none } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1f23"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="44" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="479" height="359" rx="43.5" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="36" y="64" width="408" height="232" rx="18" fill="#151517" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <path d="M37 98 H443" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="64" cy="81" r="5" fill="#3a3a40"/><circle cx="84" cy="81" r="5" fill="#3a3a40"/><circle cx="104" cy="81" r="5" fill="#3a3a40"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">
    <text x="60" y="132" fill="#60ccbe">$</text><text x="84" y="132" fill="#f5f5f7">hop rm feat/x</text>
    <text x="60" y="166" fill="#60ccbe">$</text><text x="84" y="166" fill="#f5f5f7">hop clean</text>
    <g class="c c0">
      <text x="60" y="206" fill="#f5f5f7">feat/old</text><text x="300" y="206" fill="#60ccbe">merged</text>
    </g>
    <g class="c c1">
      <text x="60" y="240" fill="#f5f5f7">feat/gone</text><text x="300" y="240" fill="#60ccbe">gone</text>
    </g>
    <g class="c c2">
      <text x="60" y="274" fill="#f5f5f7">feat/stale</text><text x="300" y="274" fill="#60ccbe">prunable</text>
    </g>
  </g>
</svg>
